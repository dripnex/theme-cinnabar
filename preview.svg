<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cinnabar editor preview">
  <rect width="960" height="540" fill="#141014"/>

  <rect x="0" y="0" width="960" height="42" fill="#1e161c"/>
  <line x1="0" y1="42" x2="960" y2="42" stroke="rgba(243, 233, 228, 0.12)" stroke-width="1"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="21" r="6" fill="#febc2e"/>
  <circle cx="62" cy="21" r="6" fill="#28c840"/>
  <text x="84" y="26" fill="rgba(243, 233, 228, 0.52)" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Dripnex</text>
  <text x="480.0" y="26" text-anchor="middle" fill="#f3e9e4" font-size="12.5" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mineral mark</text>
  <text x="942" y="26" text-anchor="end" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Cinnabar</text>

  <rect x="0" y="42" width="248" height="498" fill="#1e161c"/>
  <line x1="248" y1="42" x2="248" y2="540" stroke="rgba(243, 233, 228, 0.12)" stroke-width="1"/>
  <text x="18" y="70" fill="#f3e9e4" font-size="13" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Notes</text>
  <rect x="14" y="82" width="220" height="28" rx="8" fill="#0c090c"/>
  <text x="26" y="100" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Search notes</text>

  <rect x="8" y="128" width="232" height="56" rx="8" fill="rgba(212, 69, 42, 0.2)"/><rect x="8" y="128" width="3" height="56" rx="1.5" fill="#d4452a"/>
  <text x="22" y="152" fill="#d4452a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mineral mark</text><text x="22" y="170" fill="rgba(243, 233, 228, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">One vermillion stroke on stone...</text>
  <text x="22" y="216" fill="#f3e9e4" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Vein notes</text><text x="22" y="234" fill="rgba(243, 233, 228, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Charcoal first, then the mark.</text>
  <text x="22" y="280" fill="#f3e9e4" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Studio log</text><text x="22" y="298" fill="rgba(243, 233, 228, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Powder, binder, then the page.</text>
  <text x="22" y="344" fill="#f3e9e4" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Pigment jar</text><text x="22" y="362" fill="rgba(243, 233, 228, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Keep the red for emphasis.</text>

  <rect x="248" y="42" width="712" height="470" fill="#141014"/>

  <text x="284" y="90" fill="#f3e9e4" font-size="28" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mineral mark</text>
  <text x="284" y="114" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Today &#183; Markdown</text>

  <text x="284" y="154" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The charcoal had settled when I sat down.</text>
  <text x="284" y="176" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">I wrote</text>
  <rect x="334" y="162" width="86" height="18" rx="4" fill="#0c090c"/>
  <text x="342" y="175" fill="#d4452a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">openNote()</text>
  <text x="426" y="176" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">and let one vermillion stroke land.</text>

  <rect x="284" y="198" width="640" height="44" rx="6" fill="rgba(212, 69, 42, 0.1)"/>
  <rect x="284" y="198" width="4" height="44" rx="2" fill="#d4452a"/>
  <text x="302" y="225" fill="rgba(243, 233, 228, 0.52)" font-size="14" font-style="italic" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Cinnabar on charcoal. One mark is enough.</text>

  <circle cx="292" cy="268" r="3" fill="#d4452a"/>
  <text x="304" y="272" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">grind the pigment</text>
  <circle cx="292" cy="292" r="3" fill="#d4452a"/>
  <text x="304" y="296" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the note</text>
  <circle cx="292" cy="316" r="3" fill="#d4452a"/>
  <text x="304" y="320" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the quiet</text>

  <text x="284" y="358" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">See also</text>
  <text x="344" y="358" fill="#d4452a" font-size="14" text-decoration="underline" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Vein notes</text>
  <text x="424" y="358" fill="#f3e9e4" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">when the jar cools.</text>

  <rect x="0" y="512" width="960" height="28" fill="#1e161c"/>
  <line x1="0" y1="512" x2="960" y2="512" stroke="rgba(243, 233, 228, 0.12)" stroke-width="1"/>
  <text x="16" y="530" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Markdown</text>
  <text x="264" y="530" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">128 words</text>
  <text x="944" y="530" text-anchor="end" fill="rgba(243, 233, 228, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Cinnabar</text>
</svg>
